name: dependency-policy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-policy-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CHEZMOI_VERSION: 2.71.1
  BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}

jobs:
  windows:
    name: Windows x86_64
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Install pinned chezmoi
        shell: powershell
        run: |
          $asset = "chezmoi_$($env:CHEZMOI_VERSION)_windows_amd64.zip"
          $root = "https://github.com/twpayne/chezmoi/releases/download/v$env:CHEZMOI_VERSION"
          Invoke-WebRequest -Uri "$root/$asset" -OutFile "$env:RUNNER_TEMP\$asset"
          Invoke-WebRequest -Uri "$root/chezmoi_$($env:CHEZMOI_VERSION)_checksums.txt" -OutFile "$env:RUNNER_TEMP\checksums.txt"
          $expected = ((Select-String -Path "$env:RUNNER_TEMP\checksums.txt" -Pattern "  $([regex]::Escape($asset))$").Line -split '\s+')[0]
          $observed = (Get-FileHash "$env:RUNNER_TEMP\$asset" -Algorithm SHA256).Hash.ToLowerInvariant()
          if (-not $expected -or $observed -ne $expected) { throw 'chezmoi archive checksum mismatch.' }
          Expand-Archive "$env:RUNNER_TEMP\$asset" "$env:RUNNER_TEMP\chezmoi"
          "CHEZMOI=$env:RUNNER_TEMP\chezmoi\chezmoi.exe" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Run Windows dependency policy
        shell: powershell
        run: ./tests/dependency-policy/run-all.ps1 -RepositoryRoot $PWD -BaseRef $env:BASE_REF -SkipQuality

  linux:
    name: Linux x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Install pinned chezmoi
        shell: sh
        run: |
          asset="chezmoi_${CHEZMOI_VERSION}_linux_amd64.tar.gz"
          root="https://github.com/twpayne/chezmoi/releases/download/v${CHEZMOI_VERSION}"
          curl -fsSL "$root/$asset" -o "$RUNNER_TEMP/$asset"
          curl -fsSL "$root/chezmoi_${CHEZMOI_VERSION}_checksums.txt" -o "$RUNNER_TEMP/checksums.txt"
          (cd "$RUNNER_TEMP" && grep "  $asset$" checksums.txt | sha256sum -c -)
          tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP" chezmoi
          printf '%s\n' "CHEZMOI=$RUNNER_TEMP/chezmoi" >> "$GITHUB_ENV"
      - name: Run Linux dependency policy
        shell: sh
        run: DEPENDENCY_POLICY_SKIP_QUALITY=1 sh tests/dependency-policy/run-all.sh "$PWD" "$BASE_REF"

  macos-arm64:
    name: macOS arm64
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Install pinned chezmoi
        shell: sh
        run: |
          test "$(uname -m)" = arm64
          asset="chezmoi_${CHEZMOI_VERSION}_darwin_arm64.tar.gz"
          root="https://github.com/twpayne/chezmoi/releases/download/v${CHEZMOI_VERSION}"
          curl -fsSL "$root/$asset" -o "$RUNNER_TEMP/$asset"
          curl -fsSL "$root/chezmoi_${CHEZMOI_VERSION}_checksums.txt" -o "$RUNNER_TEMP/checksums.txt"
          (cd "$RUNNER_TEMP" && grep "  $asset$" checksums.txt | shasum -a 256 -c -)
          tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP" chezmoi
          printf '%s\n' "CHEZMOI=$RUNNER_TEMP/chezmoi" >> "$GITHUB_ENV"
      - name: Run macOS arm64 dependency policy
        shell: sh
        run: DEPENDENCY_POLICY_SKIP_QUALITY=1 sh tests/dependency-policy/run-all.sh "$PWD" "$BASE_REF"

  macos-x86-64:
    name: macOS x86_64
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Install pinned chezmoi
        shell: sh
        run: |
          test "$(uname -m)" = x86_64
          asset="chezmoi_${CHEZMOI_VERSION}_darwin_amd64.tar.gz"
          root="https://github.com/twpayne/chezmoi/releases/download/v${CHEZMOI_VERSION}"
          curl -fsSL "$root/$asset" -o "$RUNNER_TEMP/$asset"
          curl -fsSL "$root/chezmoi_${CHEZMOI_VERSION}_checksums.txt" -o "$RUNNER_TEMP/checksums.txt"
          (cd "$RUNNER_TEMP" && grep "  $asset$" checksums.txt | shasum -a 256 -c -)
          tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP" chezmoi
          printf '%s\n' "CHEZMOI=$RUNNER_TEMP/chezmoi" >> "$GITHUB_ENV"
      - name: Run macOS x86_64 dependency policy
        shell: sh
        run: DEPENDENCY_POLICY_SKIP_QUALITY=1 sh tests/dependency-policy/run-all.sh "$PWD" "$BASE_REF"

  quality:
    name: Release assets and repository quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Install pinned chezmoi
        shell: sh
        run: |
          asset="chezmoi_${CHEZMOI_VERSION}_linux_amd64.tar.gz"
          root="https://github.com/twpayne/chezmoi/releases/download/v${CHEZMOI_VERSION}"
          curl -fsSL "$root/$asset" -o "$RUNNER_TEMP/$asset"
          curl -fsSL "$root/chezmoi_${CHEZMOI_VERSION}_checksums.txt" -o "$RUNNER_TEMP/checksums.txt"
          (cd "$RUNNER_TEMP" && grep "  $asset$" checksums.txt | sha256sum -c -)
          tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP" chezmoi
          printf '%s\n' "CHEZMOI=$RUNNER_TEMP/chezmoi" >> "$GITHUB_ENV"
      - name: Verify workflow contract
        shell: pwsh
        run: ./tests/dependency-policy/Test-CIWorkflow.ps1 -RepositoryRoot $PWD
      - name: Verify aggregate runner contracts
        shell: pwsh
        run: ./tests/dependency-policy/Test-RunnerEntrypoints.ps1 -RepositoryRoot $PWD
      - name: Verify release asset fixture contracts
        shell: pwsh
        run: ./tests/dependency-policy/Test-ReleaseAssetFixtures.ps1 -RepositoryRoot $PWD
      - name: Verify release assets and repository quality
        shell: pwsh
        run: ./tests/dependency-policy/run-all.ps1 -RepositoryRoot $PWD -BaseRef $env:BASE_REF
      - name: State evidence boundary
        run: echo 'Static/contract evidence only; no clean-install claim.'
